name: App Workflow

on:
  push:
    branches:
      - develop ## 개발 배포용
    tags:
      - "RB*" ## 운영 배포용
  pull_request: ## PR에서는 lint/test/커버리지 검사만 실행 (배포 job은 ref 조건으로 건너뜀)
    branches:
      - develop
      - main

## GITHUB_TOKEN 최소 권한 (코드 읽기만)
permissions:
  contents: read

## 같은 브랜치/태그의 실행이 겹치지 않게 한다.
##  - PR: 새 커밋이 오면 이전 검사는 취소
##  - develop/태그: 취소하지 않고 순서대로 대기 (배포 도중 끊기지 않도록)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ### 공통 환경 ####
  APP_NAME: github-action_lab
  REMOTE_USER: ubuntu
  REMOTE_DIR: /home/ubuntu/app
  REMOTE_JAVA_PATH: /usr/bin/java ## 대상 VM의 java (빌드용 JDK 와 별개, 25 이상 필요)

  ### dev 환경 ####
  DEV_SPRING_PROFILE: dev

  ### 운영 환경 ####
  PROD_SPRING_PROFILE: prod

jobs:
  # 1. 통합 빌드 (공통)
  build:
    ## runner 선택
    ##  - fork 에서 온 PR : GitHub 제공 runner (ubuntu-latest) — 외부 코드가 내부망 self-hosted runner 에 닿지 않게
    ##  - 같은 저장소 브랜치 PR : self-hosted runner (쓰기 권한자만 브랜치 생성 가능 = 내부 인원)
    ##  - push/태그 : self-hosted runner — 빌드한 jar 를 runner 로컬에 보관해 배포 job 에 넘김
    ##  ※ fork PR 이 이 파일을 고쳐 self-hosted 로 바꾸는 것은 "외부 기여자 승인 필요" 설정으로 막는다
    ##    (Settings > Actions > General). 승인 전 .github/ 변경 여부를 반드시 확인할 것.
     ## runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "global-runner"]') }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "global-runner"]') }}
    timeout-minutes: 20
    outputs:
      jar: ${{ steps.store.outputs.jar }} ## 배포 job이 그대로 받아 쓰는 jar 경로 (runner 로컬)
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: JDK 25 설정
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # validate(Checkstyle lint) → test(JUnit + JaCoCo) → package → verify(커버리지 리포트·최소치 검사)
      # 어느 단계든 실패하면 job 실패 → 배포 job(needs: build)도 실행되지 않음
      - name: Lint + Test + Coverage + Build
        run: ./mvnw -B clean verify

      - name: 테스트·커버리지 요약 (Job Summary)
        if: always()
        run: |
          {
            echo "## 테스트 결과"
            if ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
              awk -F'"' '/<testsuite /{
                  for (i=1;i<NF;i++) {
                    if ($i ~ / tests=$/) t+=$(i+1); if ($i ~ / failures=$/) f+=$(i+1);
                    if ($i ~ / errors=$/) e+=$(i+1); if ($i ~ / skipped=$/) s+=$(i+1);
                  }
                } END { printf "| 전체 | 실패 | 에러 | 건너뜀 |\n|---|---|---|---|\n| %d | %d | %d | %d |\n", t, f, e, s }' \
                target/surefire-reports/TEST-*.xml
            else
              echo "테스트 리포트 없음 (lint 또는 컴파일 단계에서 실패)"
            fi
            echo
            echo "## 커버리지 (JaCoCo)"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 } END {
                  lp = (lm+lc) ? 100*lc/(lm+lc) : 0;
                  br = (bm+bc) ? sprintf("%.1f%% (%d/%d)", 100*bc/(bm+bc), bc, bm+bc) : "- (분기 없음)";
                  printf "| 라인 | 브랜치 |\n|---|---|\n| %.1f%% (%d/%d) | %s |\n", lp, lc, lm+lc, br }' \
                target/site/jacoco/jacoco.csv
            else
              echo "커버리지 리포트 없음"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 업로드 (lint·테스트·커버리지)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      # 배포 job 은 같은 runner 에서 돌므로 jar 를 runner 로컬에 보관하고 경로를 output 으로 넘긴다.
      # (예전 'latest' 심링크 방식은 연속 push 시 다른 빌드의 jar 가 배포될 수 있었음)
      - name: 빌드 아티팩트 저장 (runner 로컬)
        id: store
        if: github.event_name == 'push'
        run: |
          shopt -s nullglob
          jars=(target/"$APP_NAME"-*.jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "::error::jar 가 정확히 1개여야 합니다: ${jars[*]:-없음}"; exit 1; }

          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            dir="$HOME/build-artifacts/dev"; keep=3
            dest="$dir/app-develop-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.jar"
            pattern="app-develop-*.jar"
          elif [[ "$GITHUB_REF" == refs/tags/RB* ]]; then
            dir="$HOME/build-artifacts/prod"; keep=5
            dest="$dir/app-$GITHUB_REF_NAME.jar"   ## rollback-prod-workflow 가 이 이름으로 찾음
            pattern="app-RB*.jar"
          else
            echo "배포 대상 ref 아님 — 보관 생략"; exit 0
          fi

          mkdir -p "$dir"
          cp "${jars[0]}" "$dest"
          # 오래된 파일 정리 (최근 $keep 개만 유지)
          ls -t "$dir"/$pattern | tail -n +$((keep + 1)) | xargs -r rm -f
          echo "jar=$dest" >> "$GITHUB_OUTPUT"
          echo "저장 완료: $dest"

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, global-runner]
    timeout-minutes: 15
    strategy:
      # 중요: max-parallel을 1로 설정하면 1대씩 순차 배포합니다.
      max-parallel: 1
      matrix: ## GitHub Actions에서 env 컨텍스트는 strategy.matrix 섹션에서 사용할 수 없다. 해당 위치에서는 github, needs, vars, inputs 컨텍스트만 허용
        server:
          - 192.168.41.15 ## dev-app-vm1

    steps:
      - name: 배포 액션 가져오기
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: ${{ matrix.server }} 배포 (systemd)
        uses: ./.github/actions/deploy-systemd
        with:
          host: ${{ matrix.server }}
          user: ${{ env.REMOTE_USER }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          jar: ${{ needs.build.outputs.jar }}
          app-name: ${{ env.APP_NAME }}
          remote-dir: ${{ env.REMOTE_DIR }}
          java-path: ${{ env.REMOTE_JAVA_PATH }}
          spring-profile: ${{ env.DEV_SPRING_PROFILE }}

  deploy-prod:
    needs: build
    # 태그가 'RB'로 시작할 때만 운영 배포 실행
    if: startsWith(github.ref, 'refs/tags/RB')
    runs-on: [self-hosted, global-runner] ## runner 선택
    timeout-minutes: 15
    environment: production ## 운영 배포 전 수동 승인 (GitHub repo Settings > Environments에서 승인자 지정)
    strategy:
      max-parallel: 1
      matrix: ## GitHub Actions에서 env 컨텍스트는 strategy.matrix 섹션에서 사용할 수 없다. 해당 위치에서는 github, needs, vars, inputs 컨텍스트만 허용
        server:
          - 192.168.41.16 ## prod-app-vm1

    steps:
      - name: 배포 액션 가져오기
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: ${{ matrix.server }} 운영 배포 (systemd)
        uses: ./.github/actions/deploy-systemd
        with:
          host: ${{ matrix.server }}
          user: ${{ env.REMOTE_USER }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          jar: ${{ needs.build.outputs.jar }}
          app-name: ${{ env.APP_NAME }}
          remote-dir: ${{ env.REMOTE_DIR }}
          java-path: ${{ env.REMOTE_JAVA_PATH }}
          spring-profile: ${{ env.PROD_SPRING_PROFILE }}
