name: github-action_lab Build 

on:
  push:
    branches:
      - develop


jobs:
  build:
    runs-on: [self-hosted, g-runner]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: maven build 
        run: |      
          ./mvnw clean package -DskipTests
      # 빌드된 파일을 아티팩트로 저장 (다음 job에서 쓰기 위함)
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar

  deploy:
    needs: build
    runs-on: [self-hosted, g-runner]
    strategy:
      # 중요: max-parallel을 1로 설정하면 1대씩 순차 배포합니다.
      max-parallel: 1
      matrix:
        server: [192.168.41.26, 192.168.41.25]

    steps:
      - name: 빌드 결과물 가져오기
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        # run: scp target/*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar
        # scp -o StrictHostKeyChecking=no 옵션이 핵심입니다. (yes/no 묻지 않음)
        run: |
          # 1. 원격 서버에 폴더가 없으면 생성 (-p 옵션은 이미 있어도 에러 안 남)
          ssh -o StrictHostKeyChecking=no vagrant@${{ matrix.server }} "mkdir -p /home/vagrant/app"
          scp -o StrictHostKeyChecking=no target/*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar

      - name: ${{ matrix.server }} 서버 재시작 (SSH)
        run: |
          ssh vagrant@${{ matrix.server }} << 'EOF'
            # 1. 기존 앱 우아하게 종료 (Graceful Shutdown)
            fuser -k 8080/tcp || true
            sleep 5
            
            # 2. 새 버전 실행
            nohup /home/vagrant/.sdkman/candidates/java/current/bin/java -Dspring.profiles.active=dev -jar /home/vagrant/app/app.jar > /home/vagrant/app/app.log 2>&1 &
            
            # 3. 헬스 체크 (정상 기동될 때까지 대기 - 최대 60초)
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP!"
                exit 0
              fi
              echo "Waiting for app to start..."
              sleep 5
            done
            echo "Deployment Failed!"
            exit 1
          EOF
