name: github-action_lab Build 

on:
  push:
    branches:
      - develop
    tags:
      - 'RB*' # RB1.0.0 등 태그 push 시 작동

jobs:
  # 1. 통합 빌드 (공통)
  build:
    runs-on: [self-hosted, g-runner]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Runner 컨테이너 내부에 JDK가 없을 경우를 대비 (필요한 버전 지정)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven build
        run: ./mvnw clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 1

  # 2. 개발 환경 배포 (develop 브랜치)
  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g-runner]
    strategy:
      max-parallel: 1
      matrix:
        server: [192.168.41.26] # test-vm1

    steps:
      - name: 빌드 결과물 가져오기
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # SSH 접속 시 yes/no 묻지 않도록 설정 추가
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        run: |
          ssh vagrant@${{ matrix.server }} "mkdir -p /home/vagrant/app"
          scp target/*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar

      - name: ${{ matrix.server }} 서버 재시작 (SSH)
        run: |
          ssh vagrant@${{ matrix.server }} << 'EOF'
            fuser -k 8080/tcp || true
            sleep 5
            nohup /home/vagrant/.sdkman/candidates/java/current/bin/java -Dspring.profiles.active=dev -jar /home/vagrant/app/app.jar > /home/vagrant/app/app.log 2>&1 &
            
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP!"
                exit 0
              fi
              echo "Waiting for app to start..."
              sleep 5
            done
            exit 1
          EOF

  # 3. 운영 환경 배포 (RB* 태그)
  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/RB')
    runs-on: [self-hosted, g-runner]
    strategy:
      max-parallel: 1
      matrix:
        server: [192.168.41.25] # test-vm2

    steps:
      - name: 빌드 결과물 가져오기
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: target/

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        run: |
          ssh vagrant@${{ matrix.server }} "mkdir -p /home/vagrant/app"
          scp target/*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar

      - name: 운영 서버 재시작 (SSH)
        run: |
          ssh vagrant@${{ matrix.server }} << 'EOF'
            fuser -k 8080/tcp || true
            sleep 5
            nohup /home/vagrant/.sdkman/candidates/java/current/bin/java -Dspring.profiles.active=prod -jar /home/vagrant/app/app.jar > /home/vagrant/app/app.log 2>&1 &
            
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP!"
                exit 0
              fi
              echo "Waiting for app to start..."
              sleep 5
            done
            exit 1
          EOF