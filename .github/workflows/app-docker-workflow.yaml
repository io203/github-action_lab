name: github-action_lab Build (Target Docker)

on:
  push:
    branches:
      - develop
    tags:
      - 'RB*'

env:
  # JIB_OPTS 정의
  JIB_OPTS: "-Djib.to.auth.username=${{ secrets.DOCKER_USER }} -Djib.to.auth.password=${{ secrets.DOCKER_PWD }}"

jobs:
  build:
    runs-on: [self-hosted, g-runner]
    container:
      image: saturn203/build-ubuntu-jdk21-maven-node-skaffold-git:v1.0.2
      options: --privileged
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Check out code
        uses: actions/checkout@v3  ## actions/checkout@v4에서 actions/checkout@v3 으로 내렸다
