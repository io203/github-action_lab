name: AI Review (OpenAI)

## PR 에 'ai-review' 라벨을 붙이면 OpenAI 모델이 변경분을 리뷰해 PR 코멘트 1개로 남긴다.
## 라벨이 붙어 있는 동안은 커밋이 추가될 때마다 같은 코멘트를 갱신한다. (그만 받으려면 라벨 제거)
##
## 준비
##  - 시크릿 OPENAI_API_KEY        : Settings > Secrets and variables > Actions > Secrets
##  - (선택) 변수 OPENAI_MODEL      : 같은 화면의 Variables 탭. 없으면 gpt-6.1-sol
##
## ※ AI 리뷰는 참고용이다. 프롬프트 주입 위험이 있으므로 Required Status Check 에 넣지 않는다.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches:   # base(머지 대상) 브랜치
      - develop
      - main

## 워크플로 기본 권한은 없음, job 에서 필요한 것만 연다
permissions: {}

## 같은 PR 의 리뷰는 최신 것만 (새 커밋이 오면 이전 리뷰 취소)
## ※ concurrency 는 job 의 if 보다 먼저 적용된다. 'ai-review' 가 아닌 라벨을 붙인 실행이 같은 그룹을 쓰면
##   (job 은 건너뛰면서) 진행 중인 리뷰만 취소해 버리므로, 그런 실행은 run_id 로 별도 그룹을 쓴다.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-review') && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ai-review:
    ## 1) 'ai-review' 라벨이 붙어 있고
    ## 2) labeled 이벤트라면 방금 붙인 라벨이 'ai-review' 일 때만 (다른 라벨 붙일 때 중복 실행 방지)
    ## 3) 같은 저장소 브랜치의 PR 만 (fork PR 에는 시크릿이 전달되지 않음)
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review')
      && (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
      && github.event.pull_request.head.repo.full_name == github.repository
    ## 외부 API 호출만 하므로 내부망 runner 불필요
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # 코드 checkout
      pull-requests: write  # PR 코멘트 작성
    steps:
      - name: OpenAI 키 확인
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::시크릿 OPENAI_API_KEY 가 없어 AI 리뷰를 건너뜁니다"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      ## 신뢰된 base(머지 대상) 커밋을 checkout 한다.
      ##  - 실행되는 리뷰 스크립트와 리뷰 규칙(.github/copilot-instructions.md 등)은 base 버전
      ##    → PR 에서 스크립트·규칙을 고쳐도 키를 가로채거나 리뷰 기준을 바꿀 수 없음
      ##  - PR 코드는 실행하지 않고 git diff 로 '데이터'로만 읽는다
      - uses: actions/checkout@v7.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0              ## base...head diff 계산에 전체 이력 필요
          persist-credentials: false  ## 이후 단계에서 git push 할 일 없음

      - name: 리뷰 준비 확인
        id: ready
        if: steps.key.outputs.ok == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # base 에 리뷰 스크립트가 없으면 (= 이 기능을 처음 도입하는 PR) 건너뜀
          if [ ! -f .github/scripts/ai_review.py ]; then
            echo "::notice::base 브랜치에 .github/scripts/ai_review.py 가 없어 AI 리뷰를 건너뜁니다 (도입 PR 이 머지된 뒤부터 동작)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR head 커밋이 없으면 가져옴 (fetch-depth: 0 이면 보통 이미 있음)
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$HEAD_SHA"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: OpenAI 리뷰 → PR 코멘트
        if: steps.ready.outputs.ok == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ## PR 제목·본문은 외부 입력 → run 에 직접 넣지 않고 env 로 전달
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I .github/scripts/ai_review.py
