name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '롤백할 태그 (예: RB-1.0.0) — 배포 이력에 있는 태그만 가능'
        required: true
        type: string

env:
  APP_NAME: github-action_lab
  REMOTE_USER: vagrant
  REMOTE_DIR: /home/vagrant/app
  JAVA_PATH: /home/vagrant/.sdkman/candidates/java/current/bin/java
  PROD_SPRING_PROFILE: prod

jobs:
  rollback:
    runs-on: [self-hosted, global-runner]
    environment: production ## 수동 승인 필요 (GitHub repo Settings > Environments)
    strategy:
      max-parallel: 1
      matrix:
        server:
          - 192.168.41.25 ## test-vm2 prod server

    steps:
      - name: 태그 유효성 검증 (아티팩트 존재 확인)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="app-${{ inputs.tag }}"
          FOUND=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .name" \
            | head -1)
          if [ -z "$FOUND" ]; then
            echo " 아티팩트 '$ARTIFACT_NAME'를 찾을 수 없습니다."
            echo "배포된 적 없는 태그이거나 아티팩트 보관 기간이 만료되었을 수 있습니다."
            echo ""
            echo "사용 가능한 아티팩트 목록 (최근 10개):"
            gh api repos/${{ github.repository }}/actions/artifacts \
              --jq '.artifacts[] | select(.expired == false) | .name' \
              | grep '^app-RB' | head -10
            exit 1
          fi
          echo " 아티팩트 '$ARTIFACT_NAME' 확인 완료"

      # 빌드 없이 기존 배포 아티팩트를 태그명으로 바로 다운로드
      - name: 아티팩트 다운로드 (app-${{ inputs.tag }})
        uses: actions/download-artifact@v4
        with:
          name: app-${{ inputs.tag }}
          path: ./artifact

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        run: |
          ssh ${{ env.REMOTE_USER }}@${{ matrix.server }} "mkdir -p ${{ env.REMOTE_DIR }}"
          scp ./artifact/${{ env.APP_NAME }}*.jar ${{ env.REMOTE_USER }}@${{ matrix.server }}:${{ env.REMOTE_DIR }}/app.jar

      - name: ${{ matrix.server }} 롤백 배포 (SSH)
        run: |
          ssh ${{ env.REMOTE_USER }}@${{ matrix.server }} \
            JAVA_PATH="${{ env.JAVA_PATH }}" \
            SPRING_PROFILE="${{ env.PROD_SPRING_PROFILE }}" \
            REMOTE_DIR="${{ env.REMOTE_DIR }}" \
            ROLLBACK_TAG="${{ inputs.tag }}" \
            'bash -s' << 'EOF'
            echo "롤백 태그: $ROLLBACK_TAG"

            # 1. 기존 앱 종료
            fuser -k 8080/tcp || true
            sleep 5

            # 2. 롤백 버전 실행 (이전 로그 초기화 후 실행, disown으로 SSH 세션 종료 후에도 프로세스 유지)
            > "$REMOTE_DIR/app.log"
            nohup "$JAVA_PATH" \
              -Dspring.profiles.active="$SPRING_PROFILE" \
              -jar "$REMOTE_DIR/app.jar" > "$REMOTE_DIR/app.log" 2>&1 & disown

            # 3. 초기 기동 에러 빠른 감지 (포트 충돌, 설정 오류 등 즉시 실패)
            sleep 3
            if grep -q "APPLICATION FAILED TO START\|Port.*already in use\|Unable to start" "$REMOTE_DIR/app.log" 2>/dev/null; then
              echo "롤백 실패! 원인:"
              tail -30 "$REMOTE_DIR/app.log"
              exit 1
            fi

            # 4. 헬스 체크 (최대 60초)
            for i in {1..12}; do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "롤백 성공! ($ROLLBACK_TAG)"
                exit 0
              fi
              # 헬스체크 대기 중 치명적 에러 감지 시 즉시 중단
              if grep -q "APPLICATION FAILED TO START\|Port.*already in use" "$REMOTE_DIR/app.log" 2>/dev/null; then
                echo "롤백 실패! 원인:"
                tail -30 "$REMOTE_DIR/app.log"
                exit 1
              fi
              echo "기동 대기 중... ($i/12)"
              sleep 5
            done
            echo "롤백 실패!"
            exit 1
          EOF

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/id_rsa
