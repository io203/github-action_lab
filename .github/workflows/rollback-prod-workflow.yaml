name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "롤백할 태그 (예: RB-1.0.0) — runner의 ~/build-artifacts/prod/ 에서 확인"
        required: true
        type: string

permissions:
  contents: read

## 운영 배포(App Workflow)와 별개로, 롤백끼리는 동시에 돌지 않게
concurrency:
  group: rollback-prod
  cancel-in-progress: false

env:
  APP_NAME: github-action_lab
  REMOTE_USER: vagrant
  REMOTE_DIR: /home/vagrant/app
  REMOTE_JAVA_PATH: /home/vagrant/.sdkman/candidates/java/current/bin/java
  PROD_SPRING_PROFILE: prod

jobs:
  rollback:
    runs-on: [self-hosted, global-runner]
    timeout-minutes: 15
    environment: production ## 수동 승인 필요 (GitHub repo Settings > Environments)
    strategy:
      max-parallel: 1
      matrix:
        server:
          - 192.168.41.26 ## prod server

    steps:
      - name: 아티팩트 존재 확인 (app-${{ inputs.tag }}.jar)
        id: artifact
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # 태그 이름 검증 (경로 조작 방지)
          [[ "$TAG" =~ ^RB[A-Za-z0-9._-]*$ ]] || { echo "::error::잘못된 태그 형식: $TAG"; exit 1; }
          ARTIFACT="$HOME/build-artifacts/prod/app-$TAG.jar"
          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::아티팩트를 찾을 수 없습니다: $ARTIFACT"
            echo "사용 가능한 버전 목록:"
            ls ~/build-artifacts/prod/ 2>/dev/null || echo "(없음)"
            exit 1
          fi
          echo "jar=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "아티팩트 확인 완료: $ARTIFACT"

      - name: 배포 액션 가져오기
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: ${{ matrix.server }} 롤백 배포 (systemd)
        uses: ./.github/actions/deploy-systemd
        with:
          host: ${{ matrix.server }}
          user: ${{ env.REMOTE_USER }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          jar: ${{ steps.artifact.outputs.jar }}
          app-name: ${{ env.APP_NAME }}
          remote-dir: ${{ env.REMOTE_DIR }}
          java-path: ${{ env.REMOTE_JAVA_PATH }}
          spring-profile: ${{ env.PROD_SPRING_PROFILE }}
