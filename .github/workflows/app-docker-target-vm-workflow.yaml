name: github-action_lab Build 

on:
  push:
    branches:
      - develop
    tags:
      - 'RB*' # RB1.0.0 등 태그 push 시 작동

jobs:
  # 1. 통합 빌드 (공통)
  build:
    runs-on: [self-hosted, g-runner]
    steps:
      
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 설정 (Spring Boot는 보통 Java 17/21 사용)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'   # 또는 'zulu', 'corretto' 등
          cache: maven              # Maven 의존성 캐싱 자동 처리

      # 3. Maven Clean + Build + Test
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests   # 테스트 실행하려면 skipTests=false
