name: github-action_lab Build 

on:
  push:
    branches:
      - develop
    tags:
      - 'RB*' # RB1.0.0 등 태그 push 시 작동

jobs:
  # 1. 통합 빌드 (공통)
  build:
    runs-on: [self-hosted, g-runner]
    steps:
      
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4      

      - name: Skaffold build 
        env:
          MAVEN_OPTS: "-Djib.to.auth.username=${{ secrets.DOCKER_USER }} -Djib.to.auth.password=${{ secrets.DOCKER_PWD }}"
        run: |
          # develop 브랜치
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            SKAFFOLD_PROFILE="dev"
            IMAGE_TAG="develop-$(TZ='Asia/Seoul' date +'%Y%m%d-%H%M%S')"

          # git tag (release)
          elif [[ "${GITHUB_REF}" == refs/tags/RB-* ]]; then
            SKAFFOLD_PROFILE="prod"
            IMAGE_TAG="${GITHUB_REF_NAME}"

          else
            echo "Not a build target: ${GITHUB_REF}"
            exit 0
          fi
          #### debug
          echo "MAVEN_OPTS=${MAVEN_OPTS}"
          echo "SKAFFOLD_PROFILE=${SKAFFOLD_PROFILE}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          #####
          
          ## 이미지테그 정보 변수파일 생성
          echo "IMAGE_TAG=$IMAGE_TAG" >> build_tag.env
          skaffold build --cache-artifacts=false   -p $SKAFFOLD_PROFILE -t $IMAGE_TAG
      
      - name: 빌드 결과 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build_tag.env

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g-runner]
    strategy:
      matrix:
        server: [192.168.41.26] ## test-vm1
    steps:
      - name: 아티팩트 다운로드 (이 단계가 꼭 필요합니다)
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
      - name: 태그 추출 및 환경변수 등록
        id: get_tag
        run: |
          # 파일 내용을 읽어 GitHub 환경변수에 등록
          cat build_tag.env >> $GITHUB_ENV
          
          # 확인용 (로그에 찍힘)
          source build_tag.env
          echo "추출된 태그는 $IMAGE_TAG 입니다."
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          

      - name: ${{ matrix.server }} 서버로 전송 및 Docker 배포
        run: |
          # 1. 원격 서버에 JAR 파일과 Dockerfile 전송
          ssh -o StrictHostKeyChecking=no vagrant@${{ matrix.server }} "mkdir -p ~/app"
          # 2. 저장소에 있는 docker-compose.yml 전송 
          scp -o StrictHostKeyChecking=no docker-compose.yml vagrant@${{ matrix.server }}:~/app/docker-compose.yml
          
          # 2. 원격 서버에서 Docker 빌드 및 실행
          ssh vagrant@${{ matrix.server }} << 'EOF'
            cd ~/app

            export IMAGE_NAME="saturn203/github-action_lab:${{ env.IMAGE_TAG }}"
            # 기존 컨테이너 중지 및 삭제 후 재시작 (docker-compose 사용 시)
            docker compose up -d --force-recreate
            docker image prune -f

            # 헬스 체크
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP in Docker!"
                exit 0
              fi
              sleep 5
            done
            exit 1
          EOF

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/RB')
    runs-on: [self-hosted, g-runner]
    strategy:
      matrix:
        server: [192.168.41.25] ## test-vm2 prod server
    steps:
      - name: 아티팩트 다운로드 (이 단계가 꼭 필요합니다)
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
      - name: 태그 추출 및 환경변수 등록
        id: get_tag
        run: |
          # 파일 내용을 읽어 GitHub 환경변수에 등록
          cat build_tag.env >> $GITHUB_ENV
          
          # 확인용 (로그에 찍힘)
          source build_tag.env
          echo "추출된 태그는 $IMAGE_TAG 입니다."
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: ${{ matrix.server }} 서버로 전송 및 Docker 배포
        run: |
          # 1. 원격 서버에 JAR 파일과 Dockerfile 전송
          ssh -o StrictHostKeyChecking=no vagrant@${{ matrix.server }} "mkdir -p ~/app"
          # 2. 저장소에 있는 docker-compose.yml 전송 
          scp -o StrictHostKeyChecking=no docker-compose.yml vagrant@${{ matrix.server }}:~/app/docker-compose.yml

          
          
          # 2. 원격 서버에서 Docker 빌드 및 실행
          ssh vagrant@${{ matrix.server }} << 'EOF'
            cd ~/app

            export IMAGE_NAME="saturn203/github-action_lab:${{ env.IMAGE_TAG }}"
            # 기존 컨테이너 중지 및 삭제 후 재시작 (docker-compose 사용 시)
            docker compose up -d --force-recreate
            docker image prune -f

            # 헬스 체크
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP in Docker!"
                exit 0
              fi
              sleep 5
            done
            exit 1
          EOF
