name: github-action_lab Build (Target VM)

on:
  push:
    branches:
      - develop
    tags:
      - 'RB*'

jobs:
  # 1. 통합 빌드 (공통)
  build:
    runs-on: [self-hosted, g-runner]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Maven build
        run: ./mvnw clean package -DskipTests

      - name: Save Build Artifact
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            mkdir -p ~/download/dev
            cp target/github-action_lab*.jar  ~/download/dev
          elif [[ "${GITHUB_REF}" == refs/tags/RB-* ]]; then
            mkdir -p ~/download/prod
            cp target/*.jar  ~/download/prod
          fi

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g-runner]
    strategy:
      # 중요: max-parallel을 1로 설정하면 1대씩 순차 배포합니다.
      max-parallel: 1
      matrix:
        server: 
          - 192.168.41.26 ## test-vm1 dev-server
          - 192.168.41.25 ## test-vm2 dev server

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        # scp -o StrictHostKeyChecking=no 옵션이 핵심입니다. (yes/no 묻지 않음)
        run: |
          # 1. 원격 서버에 폴더가 없으면 생성 (-p 옵션은 이미 있어도 에러 안 남)
          ssh -o StrictHostKeyChecking=no vagrant@${{ matrix.server }} "mkdir -p /home/vagrant/app"
          scp -o StrictHostKeyChecking=no ~/download/dev/github-action_lab*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar

      - name: ${{ matrix.server }} 서버 재시작 (SSH)
        run: |
          ssh vagrant@${{ matrix.server }} << 'EOF'
            # 1. 기존 앱 우아하게 종료 (Graceful Shutdown)
            fuser -k 8080/tcp || true
            sleep 5
            
            # 2. 새 버전 실행
            nohup /home/vagrant/.sdkman/candidates/java/current/bin/java -Dspring.profiles.active=dev -jar /home/vagrant/app/app.jar > /home/vagrant/app/app.log 2>&1 &
            
            # 3. 헬스 체크 (정상 기동될 때까지 대기 - 최대 60초)
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP!"
                exit 0
              fi
              echo "Waiting for app to start..."
              sleep 5
            done
            echo "Deployment Failed!"
            exit 1
          EOF

  deploy-prod:
    needs: build
    # 태그가 'RB'로 시작할 때만 운영 배포 실행
    if: startsWith(github.ref, 'refs/tags/RB')
    runs-on: [self-hosted, g-runner]
    strategy:
      max-parallel: 1
      matrix:
        server: 
          - 192.168.41.27 ## test-vm2 prod server

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: ${{ matrix.server }} 서버로 전송 (SCP)
        # scp -o StrictHostKeyChecking=no 옵션이 핵심입니다. (yes/no 묻지 않음)
        run: |
          # 1. 원격 서버에 폴더가 없으면 생성 (-p 옵션은 이미 있어도 에러 안 남)
          ssh -o StrictHostKeyChecking=no vagrant@${{ matrix.server }} "mkdir -p /home/vagrant/app"
          scp -o StrictHostKeyChecking=no ~/download/prod/github-action_lab*.jar vagrant@${{ matrix.server }}:/home/vagrant/app/app.jar


      - name: 운영 서버 재시작 (SSH)
        run: |
          ssh vagrant@${{ matrix.server }} << 'EOF'
            fuser -k 8080/tcp || true
            sleep 5
            
            # 운영 프로파일(prod) 적용
            nohup /home/vagrant/.sdkman/candidates/java/current/bin/java \
                  -Dspring.profiles.active=prod \
                  -jar /home/vagrant/app/app.jar > /home/vagrant/app/app.log 2>&1 &
            
            # 3. 헬스 체크 (정상 기동될 때까지 대기 - 최대 60초)
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep "UP"; then
                echo "App is UP!"
                exit 0
              fi
              echo "Waiting for app to start..."
              sleep 5
            done
            echo "Deployment Failed!"
            exit 1
          EOF
