name: PR Convention

## PR 의 커밋 메시지·PR 제목이 Conventional Commits 형식인지 검사 (규칙: commitlint.config.mjs)
## 실패하면 Required Status Check 로 머지가 막힌다.
on:
  pull_request:
    ## edited: PR 제목을 고치면 다시 검사
    types: [opened, edited, synchronize, reopened]
    branches:   # ← base(머지 대상) 브랜치 필터
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: pr-convention-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COMMITLINT_VERSION: "21.2.4"

jobs:
  # Squash and merge 시 PR 제목이 그대로 develop/main 의 커밋 메시지가 되므로 가장 중요한 검사
  pr-title:
    ## 메시지 검사만 하므로 내부망이 필요 없음 → 항상 GitHub 제공 runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: commitlint.config.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: commitlint 설치
        run: npm install --no-save --no-package-lock "@commitlint/cli@$COMMITLINT_VERSION" "@commitlint/config-conventional@$COMMITLINT_VERSION"

      - name: PR 제목 검사
        env:
          ## PR 제목은 외부 입력 → ${{ }} 를 run 에 직접 넣지 않고 env 로 받아야 셸 주입이 안 됨
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR 제목: $PR_TITLE"
          if ! printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose; then
            {
              echo "## ❌ PR 제목이 Conventional Commits 형식이 아닙니다"
              echo
              echo "- 현재 제목: \`$PR_TITLE\`"
              echo "- 형식: \`<type>(<scope>): <subject>\` — 예) \`feat(api): 인사 메시지 조회 API 추가\`"
              echo "- type: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              echo
              echo "PR 화면에서 제목을 고치면 자동으로 다시 검사합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # PR 에 포함된 각 커밋 메시지 검사 (merge / fixup! / squash! 커밋은 commitlint 가 자동 제외)
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 ## base~head 사이 커밋을 모두 읽기 위해 전체 이력 필요

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: commitlint 설치
        run: npm install --no-save --no-package-lock "@commitlint/cli@$COMMITLINT_VERSION" "@commitlint/config-conventional@$COMMITLINT_VERSION"

      - name: PR 커밋 메시지 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "검사 범위: ${BASE_SHA::7}..${HEAD_SHA::7}"
          git log --format='  %h %s' "$BASE_SHA..$HEAD_SHA"
          if ! npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose; then
            {
              echo "## ❌ 규칙에 맞지 않는 커밋 메시지가 있습니다"
              echo
              echo "로그에서 ✖ 표시된 커밋을 확인하세요. 고치는 방법:"
              echo "- 마지막 커밋: \`git commit --amend\` 후 \`git push --force-with-lease\`"
              echo "- 여러 커밋: \`git rebase -i origin/${GITHUB_BASE_REF}\` 에서 reword 후 \`git push --force-with-lease\`"
              echo "- 또는 Squash and merge 를 쓰면 PR 제목만 맞으면 되므로, 팀 규칙에 따라 이 검사를 Required 에서 뺄 수 있음"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
